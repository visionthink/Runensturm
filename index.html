<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runensturm – Arena der Elemente</title>
<meta http-equiv="refresh" content="0; url=./app/">
<style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0c1d14;color:#ffd97a;font-family:system-ui,sans-serif;font-size:20px}a{color:#ffd97a}</style>
</head>
<body>
<p>Runensturm wird geladen … <a href="./app/">Hier tippen, falls nichts passiert</a></p>
<script>
// Alten Offline-Speicher der früheren Version aufräumen, dann weiterleiten
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(new URL(r.scope).pathname==='/Runensturm/')r.unregister()})).catch(()=>{})}catch(e){}
location.replace('./app/');
</script>
</body>
</html>
